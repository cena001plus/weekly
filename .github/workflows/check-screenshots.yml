name: 检查自荐截图数量

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX = 8;
            const LABEL = 'too-many-screenshots';
            const MARKER = '<!-- screenshot-limit -->';

            const issue = context.payload.issue;
            const body = issue.body || '';

            // 只处理由“作品自荐 / 投稿”模板创建的 Issue
            const match = body.match(/^###\s*产品截图\s*$([\s\S]*?)(?=^###\s|(?![\s\S]))/m);
            if (!match) return;

            const section = match[1];
            const markdownImages = section.match(/!\[[^\]]*\]\([^)]*\)/g) || [];
            const htmlImages = section.match(/<img\b[^>]*>/gi) || [];
            const count = markdownImages.length + htmlImages.length;
            core.info(`截图数量：${count}`);

            const { owner, repo } = context.repo;
            const issue_number = issue.number;
            const hasLabel = issue.labels.some(l => l.name === LABEL);

            if (count > MAX) {
              if (hasLabel) return; // 已提醒过，避免重复评论
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${MARKER}\n@${issue.user.login} 你上传了 **${count}** 张截图，超过了最多 ${MAX} 张的限制。请编辑此 Issue，删减至 ${MAX} 张以内，修改后此提醒会自动移除。`,
              });
            } else if (hasLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              for (const c of comments) {
                if (c.body && c.body.startsWith(MARKER)) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                }
              }
            }
