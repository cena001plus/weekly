name: 🚀 作品自荐 / 投稿
description: 自荐你的独立产品、开源工具或设计作品进入周刊与官网展台
title: "[自荐] "
labels: ["showcase", "pending-review"]
body:
  - type: input
    id: product_name
    attributes:
      label: 作品 / 产品名称
      placeholder: 例如：Pixsolo / Figma Design System
    validations:
      required: true
  - type: dropdown
    id: product_type
    attributes:
      label: 作品形态
      options:
        - 网页应用
        - 移动应用
        - 桌面应用
        - 小程序
        - 命令行工具
        - 扩展与插件
        - Skill & Agent
        - API / SDK
        - 设计作品 & 创意
        - 其他
    validations:
      required: true
  - type: input
    id: website_url
    attributes:
      label: 访问链接 / 体验地址 / 作品主页
      placeholder: 官网网址、GitHub 地址、或 Dribbble/Figma/Behance 链接
    validations:
      required: true
  - type: textarea
    id: tagline
    attributes:
      label: 一句话介绍
      placeholder: 用简短的一两句话说明该作品的核心特色或解决的痛点...
    validations:
      required: true
  - type: textarea
    id: logo
    attributes:
      label: 产品 Logo
      description: 将 Logo 图片拖拽或粘贴到下方输入框即可上传，建议使用正方形图片。
      placeholder: 拖拽或粘贴 Logo 图片到此处...
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 产品截图
      description: 将截图拖拽或粘贴到下方输入框即可上传，可上传多张，最多不超过 8 张。
      placeholder: 拖拽或粘贴截图到此处（最多 8 张）...
    validations:
      required: false
